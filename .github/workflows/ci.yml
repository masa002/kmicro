# kmicro CI.
#   unit      the tool tests without any toolchain: the tests that need one skip
#   qemu      the toolchains of toolchain/versions.txt, then the tool tests with them (the start code's QEMU probes
#             included) and tests/run_all.py on QEMU, as is and under GC stress
#   windows   the same on Windows, without the run under GC stress
#   difftest tools/difftest.py, as is and under GC stress (long), and missing_natives --check on the IR of its
#             programs: on pushes to main, by hand and weekly
#   next-kotlin  the tool tests and tests/run_all.py with the newest Kotlin release instead of the tested one: by
#             hand and weekly. It may fail without failing the run
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'                # Mondays, 04:23 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: '1'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: python -m unittest discover -s tests/unit
        run: python -m unittest discover -s tests/unit -v

  qemu:
    name: QEMU suite (run_all)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Kotlin/Native version
        id: versions
        run: |
          v=$(awk '$1 == "kotlin-native" && $3 == "linux-x64" { print $2; exit }' toolchain/versions.txt)
          echo "kotlin-native=$v" >> "$GITHUB_OUTPUT"
      - name: Cache ~/.konan (the LLVM and sysroot that Kotlin/Native downloads)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.versions.outputs.kotlin-native }}-qemu
      - name: Install Kotlin/Native, xPack GCC and xPack QEMU (toolchain/versions.txt, SHA-256 checked)
        run: |
          set -euo pipefail
          mkdir -p ~/toolchains ~/downloads
          for tool in kotlin-native arm-gcc qemu; do
            read -r sha url < <(awk -v t="$tool" \
              '$1 == t && $3 == "linux-x64" { sha = $4; getline; print sha, $1; exit }' toolchain/versions.txt)
            file=~/downloads/"$tool.tar.gz"
            echo "$tool: $url"
            curl -fsSL --retry 3 -o "$file" "$url"
            echo "$sha  $file" | sha256sum -c -
            tar -xzf "$file" -C ~/toolchains
          done
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"; fi
      - name: First compile (downloads the LLVM of Kotlin/Native when ~/.konan is not cached)
        run: python tests/run_all.py add
      - name: python toolchain/paths.py
        run: python toolchain/paths.py
      - name: python -m unittest discover -s tests/unit (with the toolchains)
        run: python -m unittest discover -s tests/unit
      - name: python tests/run_all.py
        run: python tests/run_all.py
      - name: python tests/run_all.py --stress
        run: python tests/run_all.py --stress
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run_all-logs
          path: build/t/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  # The tools have code for Windows only: paths outside the ANSI code page, Java started without the .bat launchers,
  # the xPack tools run by a file's bare name (BUILDING.md, "Hosts"). No --stress here, to keep the job short.
  windows:
    name: Windows (unit tests and run_all)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Kotlin/Native version
        id: versions
        run: |
          v=$(awk '$1 == "kotlin-native" && $3 == "windows-x64" { print $2; exit }' toolchain/versions.txt)
          echo "kotlin-native=$v" >> "$GITHUB_OUTPUT"
      - name: Cache ~/.konan (the LLVM and sysroot that Kotlin/Native downloads)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.versions.outputs.kotlin-native }}-windows
      - name: Install Kotlin/Native, xPack GCC and xPack QEMU (toolchain/versions.txt, SHA-256 checked)
        run: |
          set -euo pipefail
          mkdir -p ~/toolchains ~/downloads
          for tool in kotlin-native arm-gcc qemu; do
            read -r sha url < <(awk -v t="$tool" \
              '$1 == t && $3 == "windows-x64" { sha = $4; getline; print sha, $1; exit }' toolchain/versions.txt)
            file=~/downloads/"$tool.zip"
            echo "$tool: $url"
            curl -fsSL --retry 3 -o "$file" "$url"
            echo "$sha  $file" | sha256sum -c -
            unzip -q "$file" -d ~/toolchains
          done
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"; fi
      - name: First compile (downloads the LLVM of Kotlin/Native when ~/.konan is not cached)
        run: python tests/run_all.py add
      - name: python toolchain/paths.py
        run: python toolchain/paths.py
      - name: python -m unittest discover -s tests/unit (with the toolchains)
        run: python -m unittest discover -s tests/unit
      - name: python tests/run_all.py
        run: python tests/run_all.py
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run_all-logs-windows
          path: build/t/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  difftest:
    name: Differential tests (difftest)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Kotlin/Native version
        id: versions
        run: |
          v=$(awk '$1 == "kotlin-native" && $3 == "linux-x64" { print $2; exit }' toolchain/versions.txt)
          echo "kotlin-native=$v" >> "$GITHUB_OUTPUT"
      - name: Cache ~/.konan (the LLVM and sysroots that Kotlin/Native downloads, the host's included)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.versions.outputs.kotlin-native }}-difftest
      - name: Install Kotlin/Native, xPack GCC and xPack QEMU (toolchain/versions.txt, SHA-256 checked)
        run: |
          set -euo pipefail
          mkdir -p ~/toolchains ~/downloads
          for tool in kotlin-native arm-gcc qemu; do
            read -r sha url < <(awk -v t="$tool" \
              '$1 == t && $3 == "linux-x64" { sha = $4; getline; print sha, $1; exit }' toolchain/versions.txt)
            file=~/downloads/"$tool.tar.gz"
            echo "$tool: $url"
            curl -fsSL --retry 3 -o "$file" "$url"
            echo "$sha  $file" | sha256sum -c -
            tar -xzf "$file" -C ~/toolchains
          done
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"; fi
      - name: First compile (downloads the LLVM of Kotlin/Native when ~/.konan is not cached)
        run: python tests/run_all.py add
      - name: python toolchain/paths.py
        run: python toolchain/paths.py
      - name: python tools/difftest.py
        run: python tools/difftest.py
      - name: python tools/missing_natives.py --check (the runtime functions the difftest programs declare)
        run: python tools/missing_natives.py --check --ir 'build/diff/kmicro/*/m4.ll'
      - name: python tools/difftest.py --stress
        run: python tools/difftest.py --stress
      - name: Keep the outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: difftest-outputs
          path: build/diff/*.txt
          if-no-files-found: ignore
          retention-days: 14

  # kmicro reads the IR of one Kotlin/Native version, and the next one can change what its tools match. This job
  # shows that early: a test fails, or the log of run_all -v holds a warning of the build tools. Its failure does
  # not fail the run (continue-on-error); it leaves a warning on the run's summary page.
  next-kotlin:
    name: Newest Kotlin release (may fail)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Kotlin/Native version (the newest release of JetBrains/kotlin, pre-releases included)
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api 'repos/JetBrains/kotlin/releases?per_page=1' --jq '.[0].tag_name')
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)+(-[A-Za-z0-9.]+)?$ ]] || { echo "unexpected tag: $tag"; exit 1; }
          echo "Kotlin ${tag#v}"
          echo "kotlin-native=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Cache ~/.konan (the LLVM and sysroot that Kotlin/Native downloads)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.versions.outputs.kotlin-native }}-qemu
      - name: Install xPack GCC and xPack QEMU (toolchain/versions.txt) and that Kotlin/Native (SHA-256 checked)
        env:
          KOTLIN: ${{ steps.versions.outputs.kotlin-native }}
        run: |
          set -euo pipefail
          mkdir -p ~/toolchains ~/downloads
          for tool in arm-gcc qemu; do
            read -r sha url < <(awk -v t="$tool" \
              '$1 == t && $3 == "linux-x64" { sha = $4; getline; print sha, $1; exit }' toolchain/versions.txt)
            file=~/downloads/"$tool.tar.gz"
            echo "$tool: $url"
            curl -fsSL --retry 3 -o "$file" "$url"
            echo "$sha  $file" | sha256sum -c -
            tar -xzf "$file" -C ~/toolchains
          done
          # the release's own archive and the .sha256 file next to it (versions.txt has the tested version only)
          name=kotlin-native-prebuilt-linux-x86_64-$KOTLIN
          url=https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN/$name.tar.gz
          file=~/downloads/kotlin-native.tar.gz
          echo "kotlin-native: $url"
          curl -fsSL --retry 3 -o "$file" "$url"
          sha=$(curl -fsSL --retry 3 "$url.sha256" | awk '{ print $1; exit }')
          echo "$sha  $file" | sha256sum -c -
          tar -xzf "$file" -C ~/toolchains
          echo "KMICRO_KOTLIN_NATIVE=$HOME/toolchains/$name" >> "$GITHUB_ENV"
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"; fi
      - name: First compile (downloads the LLVM of Kotlin/Native when ~/.konan is not cached)
        run: python tests/run_all.py add
      - name: python toolchain/paths.py
        run: python toolchain/paths.py
      - name: python -m unittest discover -s tests/unit (with the toolchains)
        id: unit
        run: python -m unittest discover -s tests/unit
      - name: python tests/run_all.py -v (with the build messages)
        if: success() || steps.unit.outcome == 'failure'
        run: python tests/run_all.py -v
      - name: Leave a warning on the run's summary page
        if: failure()
        env:
          KOTLIN: ${{ steps.versions.outputs.kotlin-native }}
        run: echo "::warning title=Kotlin $KOTLIN::kmicro does not pass its tests with this release (job next-kotlin)"
